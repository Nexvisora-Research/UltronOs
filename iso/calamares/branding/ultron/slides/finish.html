<!DOCTYPE html>
<html>
<head>
    <style>
        body {
            font-family: 'Inter', 'Cantarell', sans-serif;
            background: linear-gradient(135deg, #1C1C1E 0%, #2C2C2E 100%);
            color: #F5F5F7;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100%;
            margin: 0;
            padding: 40px;
        }
        .checkmark {
            width: 120px;
            height: 120px;
            border-radius: 50%;
            background: linear-gradient(135deg, #6C63FF, #00D4AA);
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 30px;
        }
        .checkmark svg {
            width: 64px;
            height: 64px;
        }
        h2 {
            font-size: 48px;
            font-weight: bold;
            margin: 0 0 20px 0;
            color: #F5F5F7;
        }
        p {
            font-size: 20px;
            text-align: center;
            color: #A1A1A6;
            max-width: 600px;
            line-height: 1.6;
        }
        .links {
            margin-top: 40px;
            display: flex;
            gap: 24px;
        }
        .links a {
            color: #6C63FF;
            text-decoration: none;
            font-size: 16px;
        }
        .links a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <div class="checkmark">
        <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path d="M5 13L9 17L19 7" stroke="white" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
    </div>
    <h2>Installation Complete!</h2>
    <p>Ultron OS has been successfully installed. Restart your computer to begin your journey with a modern, beautiful Linux experience.</p>
    <div class="links">
        <a href="https://ultron.org/docs">Documentation</a>
        <a href="https://ultron.org/community">Community</a>
        <a href="https://ultron.org/support">Support</a>
    </div>
</body>
</html>
