<!DOCTYPE html>
<html>
<head>
    <style>
        body {
            font-family: 'Inter', 'Cantarell', sans-serif;
            background: linear-gradient(135deg, #1C1C1E 0%, #2C2C2E 100%);
            color: #F5F5F7;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100%;
            margin: 0;
            padding: 40px;
        }
        .logo {
            width: 120px;
            height: 120px;
            margin-bottom: 30px;
        }
        h1 {
            font-size: 48px;
            font-weight: bold;
            margin: 0 0 20px 0;
            background: linear-gradient(135deg, #6C63FF, #00D4AA);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        p {
            font-size: 20px;
            text-align: center;
            color: #A1A1A6;
            max-width: 600px;
            line-height: 1.6;
        }
        .version {
            font-size: 14px;
            color: #6E6E73;
            margin-top: 40px;
        }
    </style>
</head>
<body>
    <div class="logo">
        <svg viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
            <defs>
                <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
                    <stop offset="0%" style="stop-color:#6C63FF;stop-opacity:1" />
                    <stop offset="100%" style="stop-color:#00D4AA;stop-opacity:1" />
                </linearGradient>
            </defs>
            <circle cx="256" cy="256" r="240" fill="url(#grad)"/>
            <path d="M 140 160 L 140 320 Q 140 380 200 380 L 312 380 Q 372 380 372 320 L 372 160 L 312 160 L 312 320 Q 312 340 292 340 L 220 340 Q 200 340 200 320 L 200 160 Z" fill="#FFFFFF" opacity="0.95"/>
        </svg>
    </div>
    <h1>Welcome to Ultron OS</h1>
    <p>A modern Linux distribution combining the best of Windows 11, macOS, and GNOME with a focus on design and user experience.</p>
    <div class="version">Version 1.0.0</div>
</body>
</html>
