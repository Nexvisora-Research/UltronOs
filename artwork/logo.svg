<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="primaryGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#6C63FF;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#00D4AA;stop-opacity:1" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#000" flood-opacity="0.2"/>
    </filter>
  </defs>
  
  <!-- Background Circle -->
  <circle cx="256" cy="256" r="240" fill="url(#primaryGradient)" filter="url(#shadow)"/>
  
  <!-- Ultron 'U' Symbol -->
  <path d="M 140 160 
           L 140 320 
           Q 140 380 200 380 
           L 312 380 
           Q 372 380 372 320 
           L 372 160 
           L 312 160 
           L 312 320 
           Q 312 340 292 340 
           L 220 340 
           Q 200 340 200 320 
           L 200 160 
           Z" 
        fill="#FFFFFF" 
        opacity="0.95"/>
  
  <!-- Accent Line -->
  <rect x="140" y="400" width="232" height="8" rx="4" fill="#FFFFFF" opacity="0.6"/>
</svg>
