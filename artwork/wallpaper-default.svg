<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080">
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1C1C1E;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#2C2C2E;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1C1C1E;stop-opacity:1" />
    </linearGradient>
    
    <radialGradient id="glow1" cx="30%" cy="40%">
      <stop offset="0%" style="stop-color:#6C63FF;stop-opacity:0.3" />
      <stop offset="100%" style="stop-color:#6C63FF;stop-opacity:0" />
    </radialGradient>
    
    <radialGradient id="glow2" cx="70%" cy="60%">
      <stop offset="0%" style="stop-color:#00D4AA;stop-opacity:0.25" />
      <stop offset="100%" style="stop-color:#00D4AA;stop-opacity:0" />
    </radialGradient>
    
    <filter id="blur">
      <feGaussianBlur stdDeviation="60"/>
    </filter>
  </defs>
  
  <!-- Background -->
  <rect width="1920" height="1080" fill="url(#bgGradient)"/>
  
  <!-- Gradient Overlays -->
  <circle cx="576" cy="432" r="500" fill="url(#glow1)" filter="url(#blur)"/>
  <circle cx="1344" cy="648" r="450" fill="url(#glow2)" filter="url(#blur)"/>
  
  <!-- Geometric Accent Lines -->
  <g opacity="0.1">
    <line x1="0" y1="270" x2="1920" y2="270" stroke="#6C63FF" stroke-width="1"/>
    <line x1="0" y1="540" x2="1920" y2="540" stroke="#6C63FF" stroke-width="1"/>
    <line x1="0" y1="810" x2="1920" y2="810" stroke="#6C63FF" stroke-width="1"/>
    <line x1="480" y1="0" x2="480" y2="1080" stroke="#00D4AA" stroke-width="1"/>
    <line x1="960" y1="0" x2="960" y2="1080" stroke="#00D4AA" stroke-width="1"/>
    <line x1="1440" y1="0" x2="1440" y2="1080" stroke="#00D4AA" stroke-width="1"/>
  </g>
  
  <!-- Subtle Logo Silhouette -->
  <g transform="translate(960, 540) scale(0.8)" opacity="0.05">
    <circle cx="0" cy="0" r="200" fill="#FFFFFF"/>
    <path d="M -80 -60 L -80 40 Q -80 80 -20 80 L 20 80 Q 80 80 80 40 L 80 -60 L 20 -60 L 20 40 Q 20 60 0 60 L -20 60 Q -80 60 -80 40 L -80 -60 Z" fill="#1C1C1E"/>
  </g>
</svg>
