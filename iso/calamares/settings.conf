# Ultron OS - Calamares Installer Configuration
# Main settings file for the installer

# Sequence of modules to run during installation
sequence:
  - show:
    - welcome
    - locale
    - keyboard
    - partition
    - users
    - summary
  - exec:
    - partition
    - unpackfs
    - machineid
    - fstab
    - luksopenswaphookcfg
    - luksdevices
    - localecfg
    - keybindings
    - users
    - displaymanager
    - networkcfg
    - hwclock
    - services
    - shellprocess
    - umount
    - finished

# Branding configuration
branding:
  componentName: "Ultron OS Installer"
  shortProductName: "Ultron OS"
  version: "1.0.0"
  shortVersion: "1.0"
  productUrl: "https://ultron.org"
  bugReportUrl: "https://ultron.org/bugs"
  knownIssuesUrl: "https://ultron.org/known-issues"
  releaseNotesUrl: "https://ultron.org/release-notes"
  donateUrl: "https://ultron.org/donate"
  supportUrl: "https://ultron.org/support"
  privacyPolicyUrl: "https://ultron.org/privacy"
  licenseUrl: "https://ultron.org/license"
  onlineHelpUrl: "https://ultron.org/help"
  installerIcon: "ultron-installer"
  windowIcon: "ultron-installer"

# Module configuration
modules:
  welcome:
    - welcome.conf
  locale:
    - locale.conf
  keyboard:
    - keyboard.conf
  partition:
    - partition.conf
  users:
    - users.conf
  summary:
    - summary.conf
  partition:
    - partition.conf
  unpackfs:
    - unpackfs.conf
  machineid:
    - machineid.conf
  fstab:
    - fstab.conf
  localecfg:
    - localecfg.conf
  keybindings:
    - keybindings.conf
  users:
    - users.conf
  displaymanager:
    - displaymanager.conf
  networkcfg:
    - networkcfg.conf
  hwclock:
    - hwclock.conf
  services:
    - services.conf
  shellprocess:
    - shellprocess.conf
  umount:
    - umount.conf
  finished:
    - finished.conf
