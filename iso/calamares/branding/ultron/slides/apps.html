<!DOCTYPE html>
<html>
<head>
    <style>
        body {
            font-family: 'Inter', 'Cantarell', sans-serif;
            background: linear-gradient(135deg, #1C1C1E 0%, #2C2C2E 100%);
            color: #F5F5F7;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100%;
            margin: 0;
            padding: 40px;
        }
        h2 {
            font-size: 36px;
            font-weight: bold;
            margin: 0 0 30px 0;
            color: #6C63FF;
        }
        .apps-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 24px;
            max-width: 700px;
        }
        .app {
            background: rgba(44, 44, 46, 0.8);
            border-radius: 12px;
            padding: 20px;
            text-align: center;
            border: 1px solid #3A3A3C;
            transition: transform 0.2s;
        }
        .app:hover {
            transform: translateY(-4px);
        }
        .app-icon {
            width: 64px;
            height: 64px;
            border-radius: 16px;
            margin: 0 auto 12px;
        }
        .app-name {
            font-size: 14px;
            color: #F5F5F7;
        }
        .category {
            font-size: 16px;
            color: #A1A1A6;
            margin-top: 30px;
            text-align: center;
            max-width: 600px;
        }
        .preinstalled {
            margin-top: 20px;
            font-size: 14px;
            color: #00D4AA;
            text-align: center;
        }
    </style>
</head>
<body>
    <h2>Pre-installed Applications</h2>
    <div class="apps-grid">
        <div class="app">
            <div class="app-icon" style="background: #FB542B;"></div>
            <div class="app-name">Brave Browser</div>
        </div>
        <div class="app">
            <div class="app-icon" style="background: #FF9500;"></div>
            <div class="app-name">Firefox</div>
        </div>
        <div class="app">
            <div class="app-icon" style="background: #1ABC9C;"></div>
            <div class="app-name">LibreOffice</div>
        </div>
        <div class="app">
            <div class="app-icon" style="background: #E74C3C;"></div>
            <div class="app-name">VLC Player</div>
        </div>
        <div class="app">
            <div class="app-icon" style="background: #5C2D91;"></div>
            <div class="app-name">GIMP</div>
        </div>
        <div class="app">
            <div class="app-icon" style="background: #0078D4;"></div>
            <div class="app-name">VS Code</div>
        </div>
        <div class="app">
            <div class="app-icon" style="background: #00B4AB;"></div>
            <div class="app-name">Inkscape</div>
        </div>
        <div class="app">
            <div class="app-icon" style="background: #4A90D9;"></div>
            <div class="app-name">Timeshift</div>
        </div>
    </div>
    <div class="category">Plus VS Code, Inkscape, Timeshift, and more — ready to use out of the box.</div>
    <div class="preinstalled">✓ All applications pre-installed — no setup required</div>
</body>
</html>
